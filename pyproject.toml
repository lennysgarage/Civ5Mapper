[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "civmapper"
version = "0.3.0"
description = "Experimental Civilization V save-to-JSON political map generator"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[project.scripts]
civmapper = "civmapper.__main__:main"

[project.optional-dependencies]
png = ["cairosvg>=2.7,<3"]
gif = ["Pillow>=10,<13", "cairosvg>=2.7,<3"]
test = ["jsonschema>=4,<5"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "third_party/*LICENSE.md"]

[tool.setuptools.packages.find]
include = ["civmapper*"]

[tool.setuptools.package-data]
civmapper = ["styles/*.json", "web/*.css", "web/*.js"]
